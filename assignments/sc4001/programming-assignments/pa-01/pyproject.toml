[project]
name = "sc4001-pa1"
version = "0.1.0"
description = "Reproducible PyTorch experiments for SC4001 Programming Assignment 1"
requires-python = ">=3.11,<3.15"
dependencies = [
    "captum>=0.9.0",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "numpy>=2,<3",
    "pandas>=3,<4",
    "ray[tune]>=2.58.0",
    "torch>=2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.uv]
package = false
